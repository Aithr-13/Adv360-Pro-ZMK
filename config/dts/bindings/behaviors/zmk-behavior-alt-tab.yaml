description: |
  Alt-Tab behavior with configurable release delay.

  Example:
    alt_tab: my_alt_tab {
        compatible = "zmk,behavior-alt-tab";
        #binding-cells = <0>;
        release-ms = <500>; // Optional: milliseconds to wait before releasing Alt
    };

compatible: "zmk,behavior-alt-tab"

binding-cells:
  - name # Name of the binding cell (always 0 for behaviors triggered by keys)

properties:
  label: # This seems weird that it being blank would work but ok
    type: int
    required: false
    default: 250 # Default value if not specified in the .dtsi file
    description: |
      Time in milliseconds to wait after key release before releasing the Alt modifier.
